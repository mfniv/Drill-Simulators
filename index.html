<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Not Your Average Drill Weekend</title>
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      font-family: inherit;
    }
    body { background: #191e2a; color: #eee; font-family: Arial, sans-serif; margin: 0; text-align: center; overflow-x: hidden; }
    canvas { background: #181b2d; border: 2px solid #335; margin: 20px auto 0 auto; display: block; border-radius: 14px; max-width: 100%; height: auto; }
    .controls { margin: 6px auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .control-row { display: flex; justify-content: center; gap: 6px; }
    #sleepBtn, .arrowBtn {
      font-size: 26px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3b6dc2;
      color: #fff;
    }
    .arrowBtn { background: #3c445e; }
    #resetBtn {
      margin: 8px auto;
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      background: #666;
      color: #fff;
      display: block;
    }
    #scoreDisplay, #timerDisplay {
      position: fixed;
      top: 12px;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 6px;
      color: #00f2ff;
    }
    #scoreDisplay { right: 12px; }
    #timerDisplay { left: 12px; }
    #overlay, #endOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #overlay button, #endOverlay button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background: #00f2ff;
      color: #000;
      font-weight: bold;
    }
    #caught {
      font-size: 24px;
      font-weight: bold;
      color: #00f2ff;
      margin-top: 12px;
      animation: flash 1s infinite alternate;
    }
    @keyframes flash {
      0% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    #finalScore {
      font-size: 16px;
      color: #00f2ff;
      margin-top: 6px;
    }
    .directions {
      font-size: 14px;
      color: #ccc;
      margin: 10px auto 20px auto;
      max-width: 90%;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h2>Not Your Average Drill Weekend</h2>
    <p>Use arrow keys or buttons to move. Hold Z or press the sleep button to rest. Avoid NCOs and get to 100% sleep!</p>
    <button onclick="startGame()">Start</button>
  </div>
  <div id="endOverlay" style="display:none">
    <h2>Full Sleep Achieved!</h2>
    <div id="finalScore"></div>
    <button onclick="restartGame()">Retry</button>
  </div>
  <div id="scoreDisplay">Score: 10000</div>
  <div id="timerDisplay">Time: 0s</div>
  <canvas id="game" width="520" height="350"></canvas>
  <div class="controls">
    <div class="control-row"><button id="up" class="arrowBtn">⬆️</button></div>
    <div class="control-row">
      <button id="left" class="arrowBtn">⬅️</button>
      <button id="sleepBtn">😴</button>
      <button id="right" class="arrowBtn">➡️</button>
    </div>
    <div class="control-row"><button id="down" class="arrowBtn">⬇️</button></div>
  </div>
  <button id="resetBtn" onclick="restartGame()">Reset</button>
  <div id="caught"></div>
  <div class="directions">Reach 100% sleep as fast as you can. NCOs reduce sleep and points. Score decreases over time!</div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    let sleepHeld = false;
    let sleepScore = 0;
    let score = 10000;
    let startTime;
    let player = { x: 260, y: 175, r: 20 };
    let ncos = [];
    let lastHit = 0;
    const ncoRadius = 19;

    function spawnNCO() {
      const angle = Math.random() * Math.PI * 2;
      return {
        x: Math.random() * (canvas.width - 2 * ncoRadius) + ncoRadius,
        y: Math.random() * (canvas.height - 2 * ncoRadius) + ncoRadius,
        vx: 2 * Math.cos(angle),
        vy: 2 * Math.sin(angle)
      };
    }

    function drawPlayer() {
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fillStyle = "#56e96d";
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "26px Arial";
      ctx.textAlign = "center";
      ctx.fillStyle = "#242";
      ctx.fillText(sleepHeld ? "😴" : "🪖", player.x, player.y + 10);
    }

    function drawSleepBar() {
      ctx.save();
      ctx.fillStyle = "#444";
      ctx.fillRect(canvas.width / 2 - 110, 20, 220, 18);
      ctx.fillStyle = "#26fbb7";
      ctx.fillRect(canvas.width / 2 - 110, 20, 220 * (sleepScore / 100), 18);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(canvas.width / 2 - 110, 20, 220, 18);
      ctx.fillStyle = "#fff";
      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.fillText(`Sleep Score: ${Math.floor(sleepScore)}%`, canvas.width / 2, 33);
      ctx.restore();
    }

    function drawNCO(nco) {
      ctx.beginPath();
      ctx.arc(nco.x, nco.y, ncoRadius, 0, Math.PI * 2);
      ctx.fillStyle = "#191b22";
      ctx.fill();
      ctx.strokeStyle = "#FFD600";
      ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(nco.x - 13, nco.y + i * 8);
        ctx.lineTo(nco.x, nco.y - 10 + i * 8);
        ctx.lineTo(nco.x + 13, nco.y + i * 8);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSleepBar();
      drawPlayer();
      ncos.forEach(drawNCO);
    }

    function update(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = (timestamp - startTime) / 1000;
      const dt = 1 / 60;

      if (sleepHeld && sleepScore < 100) {
        sleepScore += 2 * dt;
        if (sleepScore > 100) sleepScore = 100;
      }

      if (sleepScore >= 50 && ncos.length < 3) ncos.push(spawnNCO());
      if (sleepScore >= 75 && ncos.length < 4) ncos.push(spawnNCO());

      ncos.forEach(nco => {
        nco.x += nco.vx;
        nco.y += nco.vy;
        if (nco.x < ncoRadius || nco.x > canvas.width - ncoRadius) nco.vx *= -1;
        if (nco.y < ncoRadius || nco.y > canvas.height - ncoRadius) nco.vy *= -1;

        const dx = nco.x - player.x;
        const dy = nco.y - player.y;
        if (Math.hypot(dx, dy) < player.r + ncoRadius && timestamp - lastHit > 500) {
          sleepScore = Math.max(0, sleepScore - 5);
          score = Math.max(0, score - 100);
          lastHit = timestamp;
        }
      });

      score = Math.max(0, 10000 - Math.floor(elapsed * 20));
      document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
      document.getElementById('timerDisplay').textContent = `Time: ${Math.floor(elapsed)}s`;

      draw();

      if (sleepScore >= 100) {
        document.getElementById('endOverlay').style.display = 'flex';
        document.getElementById('finalScore').textContent = `Final Score: ${score} | Duration: ${Math.floor(elapsed)}s`;
      } else {
        requestAnimationFrame(update);
      }
    }

    function startGame() {
      document.getElementById('overlay').style.display = 'none';
      sleepScore = 0;
      score = 10000;
      startTime = null;
      ncos = [spawnNCO(), spawnNCO()];
      requestAnimationFrame(update);
    }

    function restartGame() {
      document.getElementById('endOverlay').style.display = 'none';
      document.getElementById('overlay').style.display = 'flex';
    }

    document.getElementById('sleepBtn').addEventListener('pointerdown', () => { sleepHeld = true; });
    document.getElementById('sleepBtn').addEventListener('pointerup', () => { sleepHeld = false; });
    document.getElementById('sleepBtn').addEventListener('pointercancel', () => { sleepHeld = false; });

    document.getElementById('left').addEventListener('click', () => { player.x = Math.max(player.r, player.x - 28); });
    document.getElementById('right').addEventListener('click', () => { player.x = Math.min(canvas.width - player.r, player.x + 28); });
    document.getElementById('up').addEventListener('click', () => { player.y = Math.max(player.r, player.y - 28); });
    document.getElementById('down').addEventListener('click', () => { player.y = Math.min(canvas.height - player.r, player.y + 28); });
  </script>
</body>
</html>
